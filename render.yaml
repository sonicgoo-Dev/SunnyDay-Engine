# What SunnyDay needs on Render. Describes services only: every secret and
# every switch is typed into Render by hand (sync: false), never written here.
databases:
  - name: sunnyday-db
    databaseName: sunnyday
    user: sunnyday_app
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: sunnyday-app
    runtime: node
    region: oregon
    plan: starter
    branch: main
    # --include=dev: the build tools are needed even if the host sets NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - app.sunnydaycrm.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: sunnyday-db, property: connectionString }
      - key: APP_URL
        value: https://app.sunnydaycrm.com
      - key: SIGNIN_SECRET
        generateValue: true
      - key: SIGNIN_GOOGLE_CLIENT_ID
        sync: false
      - key: SIGNIN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIRST_INVITES
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CONNECTION_KEY
        sync: false

  # Works through the job list (Build 2: reading connected mailboxes).
  # Exactly one instance. It holds the same CONNECTION_KEY as the app.
  - type: worker
    name: sunnyday-worker
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: sunnyday-db, property: connectionString }
      - key: CONNECTION_KEY
        sync: false
      - key: SIGNIN_GOOGLE_CLIENT_ID
        sync: false
      - key: SIGNIN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Build 4: lets List Builder ask Claude. The worker only, never the app.
      - key: ANTHROPIC_API_KEY
        sync: false
