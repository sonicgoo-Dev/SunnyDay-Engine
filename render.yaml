# What SunnyDay needs on Render. Describes services only: every secret and
# every switch is typed into Render by hand (sync: false), never written here.
databases:
  - name: sunnyday-db
    databaseName: sunnyday
    user: sunnyday_app
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: sunnyday-app
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    domains:
      - app.sunnydaycrm.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: sunnyday-db, property: connectionString }
      - key: APP_URL
        value: https://app.sunnydaycrm.com
      - key: SIGNIN_SECRET
        generateValue: true
      - key: SIGNIN_GOOGLE_CLIENT_ID
        sync: false
      - key: SIGNIN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: FIRST_INVITES
        sync: false
      - key: SENTRY_DSN
        sync: false

# The worker (worker/) joins here in Build 2, when it has jobs to run.
# Until then it would cost money to sit idle.
